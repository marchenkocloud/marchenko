<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafik · Cukiernik</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --bg2: #f3ede3;
    --surface: #ffffff;
    --border: #e8e0d4;
    --border2: #d4c9b8;
    --text: #1a1510;
    --text-mid: #5a4f42;
    --text-muted: #9a8f82;
    --caramel: #c8700a;
    --caramel-light: #f5a84e;
    --caramel-pale: #fef3e7;
    --caramel-soft: rgba(200,112,10,0.12);
    --red-soft: rgba(220,60,60,0.1);
    --red: #dc3c3c;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(26,21,16,0.07);
    --shadow-lg: 0 8px 32px rgba(26,21,16,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 50px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 8px;
  }
  .header-badge {
    display: inline-block;
    background: var(--caramel-soft);
    color: var(--caramel);
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
    border: 1px solid rgba(200,112,10,0.2);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1.05;
    letter-spacing: -0.5px;
  }
  header h1 em {
    font-style: italic;
    color: var(--caramel);
  }
  header p {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 6px;
    font-weight: 400;
  }

  /* ── STAWKA ── */
  .stawka-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stawka-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--caramel-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    border: 1px solid rgba(200,112,10,0.18);
  }
  .stawka-meta { flex: 1; }
  .stawka-meta label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stawka-input-row { display: flex; align-items: center; gap: 8px; }
  .stawka-input-row input {
    width: 90px;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .stawka-input-row input:focus {
    border-color: var(--caramel);
    background: var(--caramel-pale);
  }
  .stawka-input-row span { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; }

  /* ── CALENDAR ── */
  .calendar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .cal-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    text-transform: capitalize;
  }
  .nav-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-mid);
    width: 34px; height: 34px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-weight: 600;
  }
  .nav-btn:hover { background: var(--caramel-soft); border-color: var(--caramel); color: var(--caramel); }
  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-days-header span {
    text-align: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    padding: 4px 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    background: var(--bg);
    border: 1.5px solid transparent;
    gap: 2px;
    padding: 2px;
    min-height: 40px;
  }
  .cal-day:hover:not(.empty) {
    background: var(--caramel-pale);
    border-color: rgba(200,112,10,0.3);
  }
  .cal-day.empty { background: transparent; cursor: default; pointer-events: none; }
  .cal-day.today {
    background: var(--caramel-soft);
    border-color: var(--caramel-light);
  }
  .cal-day.today .day-num {
    color: var(--caramel);
    font-weight: 900;
  }
  .cal-day.has-shift {
    background: var(--caramel);
    border-color: var(--caramel);
  }
  .cal-day.has-shift .day-num { color: #fff; }
  .cal-day.has-shift .day-hours { color: rgba(255,255,255,0.8); }
  .day-num {
    font-family: 'Playfair Display', serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .day-hours {
    font-size: 0.58rem;
    font-weight: 700;
    color: var(--caramel);
    line-height: 1;
    letter-spacing: 0.2px;
  }

  /* ── SUMMARY ── */
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sum-divider {
    width: 1px;
    height: 48px;
    background: var(--border);
    flex-shrink: 0;
  }
  .sum-block { flex: 1; text-align: center; }
  .sum-block-label {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .sum-block-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1;
  }
  .sum-block-value.accent { color: var(--caramel); }
  .sum-block-sub {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── SHIFTS LIST ── */
  .shifts-section { margin-top: 4px; }
  .shifts-title {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .shift-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(26,21,16,0.04);
    transition: box-shadow 0.2s;
  }
  .shift-item:hover { box-shadow: var(--shadow); }
  .shift-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--caramel);
    flex-shrink: 0;
  }
  .shift-info { flex: 1; }
  .shift-pos {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--caramel);
    margin-bottom: 1px;
  }
  .shift-details { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
  .shift-pay {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    margin-right: 8px;
  }
  .del-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 5px;
    border-radius: 6px;
    transition: all 0.15s;
    line-height: 1;
  }
  .del-btn:hover { background: var(--red-soft); color: var(--red); }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 28px;
    background: var(--surface);
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
  }
  .empty-state-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; opacity: 0.4; }

  /* ── POPUP ── */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,21,16,0.5);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .popup-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .popup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--caramel);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 38px;
    width: 100%;
    max-width: 480px;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -12px 40px rgba(26,21,16,0.15);
  }
  .popup-overlay.open .popup { transform: translateY(0); }
  .popup-handle {
    width: 32px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 0 auto 18px;
  }
  .popup-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .popup-date {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .popup-day-label {
    font-size: 0.75rem;
    color: var(--caramel);
    font-weight: 600;
    margin-top: 2px;
  }
  .popup-close {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .popup-close:hover { background: var(--red-soft); color: var(--red); border-color: rgba(220,60,60,0.2); }

  .popup-section-title {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .hours-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .h-chip {
    padding: 10px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text-mid);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .h-chip:hover { border-color: var(--caramel); color: var(--caramel); background: var(--caramel-pale); }
  .h-chip.active { background: var(--caramel); border-color: var(--caramel); color: #fff; }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .custom-row label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  .custom-row input {
    width: 72px;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .custom-row input:focus { border-color: var(--caramel); background: var(--caramel-pale); }
  .custom-row span { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; }

  .popup-preview {
    background: var(--caramel-pale);
    border: 1.5px solid rgba(200,112,10,0.2);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .preview-left { font-size: 0.82rem; color: var(--text-mid); font-weight: 500; }
  .preview-left strong { color: var(--text); font-weight: 700; }
  .preview-pay {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--caramel);
  }

  .popup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .popup-actions.single { grid-template-columns: 1fr; }

  .btn-primary {
    background: var(--caramel);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(200,112,10,0.3);
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-danger {
    background: var(--red-soft);
    color: var(--red);
    border: 1.5px solid rgba(220,60,60,0.2);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  .btn-danger:hover { background: rgba(220,60,60,0.18); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  header { animation: fadeUp 0.4s ease both; }
  .stawka-card { animation: fadeUp 0.4s 0.05s ease both; }
  .calendar-card { animation: fadeUp 0.4s 0.1s ease both; }
  .summary-card { animation: fadeUp 0.4s 0.15s ease both; }
  .shifts-section { animation: fadeUp 0.4s 0.2s ease both; }

  @media (max-width: 480px) {
    body { padding: 16px 12px 50px; }
    header h1 { font-size: 1.9rem; }
    .stawka-card { padding: 14px 14px; gap: 12px; }
    .stawka-icon { width: 38px; height: 38px; font-size: 1.1rem; border-radius: 10px; }
    .stawka-input-row input { width: 80px; font-size: 1.1rem; }
    .calendar-card { padding: 14px 12px; }
    .cal-header h2 { font-size: 1rem; }
    .cal-days-header span { font-size: 0.58rem; }
    .cal-grid { gap: 3px; }
    .cal-day { border-radius: 8px; min-height: 36px; }
    .day-num { font-size: 0.76rem; }
    .day-hours { font-size: 0.54rem; }
    .summary-card { padding: 16px 14px; gap: 12px; }
    .sum-block-value { font-size: 1.25rem; }
    .popup { padding: 18px 16px 34px; }
    .popup-date { font-size: 1.05rem; }
    .h-chip { padding: 9px 15px; font-size: 0.83rem; }
    .preview-pay { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">🍰 Grafik Pracy</div>
  <h1>Suslik<br><em>Cukiernik</em></h1>
  <p>Kliknij na dzień, aby dodać zmianę</p>
</header>

<!-- STAWKA -->
<div class="stawka-card">
  <div class="stawka-icon">🧁</div>
  <div class="stawka-meta">
    <label>Stawka godzinowa</label>
    <div class="stawka-input-row">
      <input type="number" id="stawka" placeholder="0.00" min="0" step="0.5">
      <span>zł / godz.</span>
    </div>
  </div>
</div>

<!-- CALENDAR -->
<div class="calendar-card">
  <div class="cal-header">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <h2 id="cal-title"></h2>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-days-header">
    <span>Pon</span><span>Wt</span><span>Śr</span><span>Czw</span><span>Pt</span><span>Sob</span><span>Nd</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- SUMMARY -->
<div class="summary-card">
  <div class="sum-block">
    <div class="sum-block-label">Zmiany</div>
    <div class="sum-block-value" id="sum-shifts">0</div>
    <div class="sum-block-sub">w tym miesiącu</div>
  </div>
  <div class="sum-divider"></div>
  <div class="sum-block">
    <div class="sum-block-label">Godziny</div>
    <div class="sum-block-value" id="sum-hours">0h</div>
    <div class="sum-block-sub">łącznie</div>
  </div>
  <div class="sum-divider"></div>
  <div class="sum-block">
    <div class="sum-block-label">Zarobek</div>
    <div class="sum-block-value accent" id="sum-pay">0 zł</div>
    <div class="sum-block-sub">brutto</div>
  </div>
</div>

<!-- SHIFTS LIST -->
<div class="shifts-section">
  <div class="shifts-title">Historia zmian</div>
  <div id="shift-list"></div>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popup-overlay" onclick="handleOverlayClick(event)">
  <div class="popup" id="popup">
    <div class="popup-handle"></div>
    <div class="popup-top">
      <div>
        <div class="popup-date" id="popup-date"></div>
        <div class="popup-day-label" id="popup-day-label"></div>
      </div>
      <button class="popup-close" onclick="closePopup()">✕</button>
    </div>

    <div class="popup-section-title">Wybierz godziny</div>
    <div class="hours-chips" id="hours-chips">
      <button class="h-chip active" data-h="8" onclick="selectPopupHours(8)">8h</button>
      <button class="h-chip" data-h="10" onclick="selectPopupHours(10)">10h</button>
      <button class="h-chip" data-h="12" onclick="selectPopupHours(12)">12h</button>
    </div>
    <div class="custom-row">
      <label>Inne:</label>
      <input type="number" id="popup-custom" placeholder="—" min="1" max="48" oninput="selectPopupCustom(this.value)">
      <span>godz.</span>
    </div>

    <div class="popup-preview">
      <div class="preview-left">Cukiernik · <strong id="preview-hours">8h</strong></div>
      <div class="preview-pay" id="preview-pay">0,00 zł</div>
    </div>

    <div class="popup-actions single" id="popup-actions">
      <button class="btn-primary" onclick="confirmShift()">Dodaj zmianę</button>
    </div>
  </div>
</div>

<script>
let state = {
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(),
  shifts: [],
  stawka: 0,
  popupDate: null,
  popupHours: 8,
};

const MONTHS_PL = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DAYS_PL = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];

function load() {
  try {
    const s = localStorage.getItem('grafik_v3_shifts');
    if (s) state.shifts = JSON.parse(s);
    const sw = localStorage.getItem('grafik_v3_stawka');
    if (sw) state.stawka = parseFloat(sw) || 0;
    document.getElementById('stawka').value = state.stawka || '';
  } catch(e) {}
}
function save() {
  try {
    localStorage.setItem('grafik_v3_shifts', JSON.stringify(state.shifts));
    localStorage.setItem('grafik_v3_stawka', String(state.stawka));
  } catch(e) {}
}

document.getElementById('stawka').addEventListener('input', function() {
  state.stawka = parseFloat(this.value) || 0;
  save(); updateSummary(); renderShiftList(); updatePreview();
});

function changeMonth(dir) {
  state.viewMonth += dir;
  if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
  if (state.viewMonth < 0)  { state.viewMonth = 11; state.viewYear--; }
  renderCalendar(); updateSummary();
}

function renderCalendar() {
  const { viewYear: y, viewMonth: m } = state;
  document.getElementById('cal-title').textContent = `${MONTHS_PL[m]} ${y}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstDay = new Date(y, m, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const shift = state.shifts.find(s => s.date === dateKey);
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;

    const el = document.createElement('div');
    el.className = 'cal-day' + (isToday ? ' today' : '') + (shift ? ' has-shift' : '');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    el.appendChild(numEl);

    if (shift) {
      const hEl = document.createElement('div');
      hEl.className = 'day-hours';
      hEl.textContent = shift.hours + 'h';
      el.appendChild(hEl);
    }

    el.addEventListener('click', () => openPopup(dateKey));
    grid.appendChild(el);
  }
}

function openPopup(dateKey) {
  state.popupDate = dateKey;
  const dateObj = new Date(dateKey + 'T12:00:00');
  const dayOfWeek = dateObj.getDay();
  const dayIdx = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const dateStr = dateObj.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long' });
  const year = dateObj.getFullYear();

  document.getElementById('popup-date').textContent = dateStr + ' ' + year;
  document.getElementById('popup-day-label').textContent = DAYS_PL[dayIdx];

  const existing = state.shifts.find(s => s.date === dateKey);

  if (existing) {
    state.popupHours = existing.hours;
    const isPreset = [8,10,12].includes(existing.hours);
    document.querySelectorAll('.h-chip').forEach(c => {
      c.classList.toggle('active', parseInt(c.dataset.h) === existing.hours);
    });
    document.getElementById('popup-custom').value = isPreset ? '' : existing.hours;
    document.getElementById('popup-actions').className = 'popup-actions';
    document.getElementById('popup-actions').innerHTML = `
      <button class="btn-danger" onclick="deleteShiftByDate('${dateKey}')">Usuń zmianę</button>
      <button class="btn-primary" onclick="confirmShift()">Zmień godziny</button>
    `;
  } else {
    state.popupHours = 8;
    document.querySelectorAll('.h-chip').forEach(c => {
      c.classList.toggle('active', parseInt(c.dataset.h) === 8);
    });
    document.getElementById('popup-custom').value = '';
    document.getElementById('popup-actions').className = 'popup-actions single';
    document.getElementById('popup-actions').innerHTML = `
      <button class="btn-primary" onclick="confirmShift()">Dodaj zmianę</button>
    `;
  }

  updatePreview();
  document.getElementById('popup-overlay').classList.add('open');
}

function closePopup() {
  document.getElementById('popup-overlay').classList.remove('open');
  state.popupDate = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('popup-overlay')) closePopup();
}

function selectPopupHours(h) {
  state.popupHours = h;
  document.getElementById('popup-custom').value = '';
  document.querySelectorAll('.h-chip').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.h) === h);
  });
  updatePreview();
}

function selectPopupCustom(v) {
  const h = parseInt(v);
  if (h > 0 && h <= 48) {
    state.popupHours = h;
    document.querySelectorAll('.h-chip').forEach(c => c.classList.remove('active'));
    updatePreview();
  }
}

function updatePreview() {
  const h = state.popupHours || 0;
  const pay = (h * state.stawka).toFixed(2).replace('.', ',');
  document.getElementById('preview-hours').textContent = h + 'h';
  document.getElementById('preview-pay').textContent = pay + ' zł';
}

function confirmShift() {
  if (!state.popupDate || !state.popupHours) return;
  state.shifts = state.shifts.filter(s => s.date !== state.popupDate);
  state.shifts.push({ date: state.popupDate, hours: state.popupHours, id: Date.now() });
  save(); renderCalendar(); updateSummary(); renderShiftList(); closePopup();
}

function deleteShiftByDate(dateKey) {
  state.shifts = state.shifts.filter(s => s.date !== dateKey);
  save(); renderCalendar(); updateSummary(); renderShiftList(); closePopup();
}

function deleteShiftById(id) {
  state.shifts = state.shifts.filter(s => s.id !== id);
  save(); renderCalendar(); updateSummary(); renderShiftList();
}

function updateSummary() {
  // show stats for viewed month
  const { viewYear: y, viewMonth: m } = state;
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  const monthShifts = state.shifts.filter(s => s.date.startsWith(prefix));
  const totalH = monthShifts.reduce((a,s) => a + s.hours, 0);
  const totalP = monthShifts.reduce((a,s) => a + s.hours * state.stawka, 0);
  document.getElementById('sum-shifts').textContent = monthShifts.length;
  document.getElementById('sum-hours').textContent = totalH + 'h';
  document.getElementById('sum-pay').textContent = totalP.toFixed(0) + ' zł';
}

function renderShiftList() {
  const el = document.getElementById('shift-list');
  const sorted = [...state.shifts].sort((a,b) => b.date.localeCompare(a.date));
  if (sorted.length === 0) {
    el.innerHTML = '<div class="empty-state"><span class="empty-state-icon">📅</span>Brak zmian. Kliknij na dzień w kalendarzu, aby dodać.</div>';
    return;
  }
  el.innerHTML = '';
  sorted.forEach(s => {
    const pay = (s.hours * state.stawka).toFixed(2).replace('.', ',');
    const dateObj = new Date(s.date + 'T12:00:00');
    const dateStr = dateObj.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
    const item = document.createElement('div');
    item.className = 'shift-item';
    item.innerHTML = `
      <div class="shift-dot"></div>
      <div class="shift-info">
        <div class="shift-pos">Cukiernik</div>
        <div class="shift-details">${dateStr} · ${s.hours}h</div>
      </div>
      <div class="shift-pay">${pay} zł</div>
      <button class="del-btn" onclick="deleteShiftById(${s.id})">✕</button>
    `;
    el.appendChild(item);
  });
}

load();
renderCalendar();
updateSummary();
renderShiftList();
</script>
</body>
</html>
