<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0e0f14; color: #f0f1f5; font-family: sans-serif; }
.app { width: 100%; max-width: 430px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
.pages { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 16px; opacity: 0; pointer-events: none; }
.page.active { opacity: 1; pointer-events: auto; }
.tab-bar { flex-shrink: 0; display: flex; border-top: 1px solid #333; background: #161820; }
.tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: #999; font-size: 0.8rem; cursor: pointer; }
.tab-btn.active { color: #34d9a0; }
.card { background: #161820; border: 1px solid #2a2c38; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="pages">
    <div class="page active" id="p1">
      <div class="card">Карточка 1</div>
      <div class="card">Карточка 2</div>
      <div class="card">Карточка 3</div>
      <div class="card">Карточка 4</div>
      <div class="card">Карточка 5</div>
      <div class="card">Карточка 6</div>
      <div class="card">Карточка 7</div>
      <div class="card">Карточка 8</div>
      <div class="card">Карточка 9</div>
      <div class="card">Карточка 10</div>
    </div>
    <div class="page" id="p2">
      <div class="card">Страница 2 — карточка 1</div>
      <div class="card">Страница 2 — карточка 2</div>
      <div class="card">Страница 2 — карточка 3</div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="go('p1',this)">Страница 1</button>
    <button class="tab-btn" onclick="go('p2',this)">Страница 2</button>
  </div>
</div>
<script>
let cur='p1';
function go(id,btn){
  document.getElementById(cur).classList.remove('active');
  document.getElementById(id).classList.add('active');
  cur=id;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
